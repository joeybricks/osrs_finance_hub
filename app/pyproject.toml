[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs_finance_hub"
version = "0.1.0"
description = "Local OSRS Grand Exchange money-making hub using the OSRS Wiki real-time prices API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
]

# PEP 735 dependency group: dev-only tools, never shipped with the package.
# uv installs the "dev" group by default on `uv sync`.
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
osrs_finance_hub = "osrs_finance_hub.cli:main"

[tool.setuptools.packages.find]
include = ["osrs_finance_hub*"]

[tool.setuptools.package-data]
osrs_finance_hub = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
