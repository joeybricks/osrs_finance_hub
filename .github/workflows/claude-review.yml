name: Claude review

# Claude (Fable 5.1) reviews a PR, but only when asked: add the
# `claude-review` label, or comment `@claude` on the PR. It never runs on
# every push, because each review uses up Claude Pro usage.
on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    # Public repo: anyone can comment, so only owners, members and
    # collaborators can trigger a review that spends the API key.
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'claude-review') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One review per PR at a time; a new request cancels the old one. This
    # sits on the job, not the workflow, so it applies only after `if` above:
    # the review's own progress comment fires issue_comment, and at workflow
    # level that run joined the group and cancelled the review it came from.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read     # read the other workflows' results below
      id-token: write  # OIDC exchange for the Claude GitHub App token
    steps:
      # Tokens are only spent once the action below starts, so wait for every
      # other check on the PR first and stop if any failed. The review's own
      # check is excluded or it would wait for itself. Runner minutes are
      # free here; Pro usage is not.
      - name: Wait for the other checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SELF: ${{ github.job }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 32); do   # 32 x 15s = 8 min, inside the job timeout
            others=$(gh pr checks "$PR" --json name,bucket --jq "[.[] | select(.name != \"$SELF\")]")
            echo "$others" | jq -r '.[] | "\(.bucket)\t\(.name)"'
            if ! echo "$others" | jq -e 'any(.[]; .bucket == "pending")' > /dev/null; then
              failed=$(echo "$others" | jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")')
              if [ -n "$failed" ]; then
                echo "::error::Not reviewing: these checks did not pass: $failed. Fix them, then re-add the label."
                exit 1
              fi
              echo "All other checks passed."
              exit 0
            fi
            echo "Waiting..."; sleep 15
          done
          echo "::error::Gave up waiting for the other checks after 8 minutes."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068  # v1.0.267
        with:
          # Runs on the Claude Pro subscription (token from `claude setup-token`),
          # not pay-as-you-go API credit. Reviews count towards Pro usage limits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request. Read CLAUDE.md first and hold the
            change to its constraints (API etiquette, price naming, cost and
            secrets rules, GitHub Actions guardrails).

            Focus on correctness bugs, security problems and anything that
            could cost money or leak a secret. Skip style nits that Ruff
            already covers. Use inline comments for specific lines and one
            short top-level summary. If the PR looks good, say so briefly.
          claude_args: |
            --model claude-fable-5-1
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
