name: Claude review

# Claude (Fable 5.1) reviews a PR, but only when asked: add the
# `claude-review` label, or comment `@claude` on the PR. It never runs on
# every push, because each review uses up Claude Pro usage.
on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One review per PR at a time; a new request cancels the old one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Public repo: anyone can comment, so only owners, members and
    # collaborators can trigger a review that spends the API key.
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'claude-review') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write  # OIDC exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d  # v1.0.266
        with:
          # Runs on the Claude Pro subscription (token from `claude setup-token`),
          # not pay-as-you-go API credit. Reviews count towards Pro usage limits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request. Read CLAUDE.md first and hold the
            change to its constraints (API etiquette, price naming, cost and
            secrets rules, GitHub Actions guardrails).

            Focus on correctness bugs, security problems and anything that
            could cost money or leak a secret. Skip style nits that Ruff
            already covers. Use inline comments for specific lines and one
            short top-level summary. If the PR looks good, say so briefly.
          claude_args: |
            --model claude-fable-5-1
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
