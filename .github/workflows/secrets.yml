name: Secret scan

# Backstop for the gitleaks pre-commit hook, in case someone skipped it.
# No paths filter on purpose: a secret can land in any file (Terraform, docs,
# notebooks), so every push and PR is scanned. The job takes well under a minute.
on:
  push:
    branches: [develop, master]
  pull_request:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # the action lists a PR's commits via the API

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history, so every commit in the push/PR is scanned
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments need pull-requests: write; keep the token read-only.
          GITLEAKS_ENABLE_COMMENTS: "false"
