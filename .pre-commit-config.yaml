# Git hooks, run on `git commit` once installed with `uv run pre-commit install`.
# Run every hook over the whole repo with `uv run pre-commit run --all-files`.
# Remote hooks are pinned to commit SHAs (tag in the comment); bump them with
# `uv run pre-commit autoupdate --freeze`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Scans the staged changes and blocks the commit if a secret is found.
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # Ruff runs from the uv environment, so the hook, CI and your editor all use
  # the single version pinned in uv.lock rather than a second copy here.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
